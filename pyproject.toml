[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investidor-ai"
version = "0.1.0"
description = "INVESTIDOR AI - pesquisa quantitativa, backtests e paper trading (somente simulação)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "scikit-learn>=1.4"]

[project.scripts]
investidor = "investidor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
